:root {
  --bg: #f3f4f1;
  --paper: #ffffff;
  --ink: #1b2f6b;
  --ink-2: #13224f;
  --ink-soft: #e6e9f4;
  --text: #171a22;
  --muted: #697085;
  --line: #dcdee5;
  --line-2: #eceef2;
  --board: #e8eaee;
  --danger: #a32626;
  --amber: #9a6a00;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', 'Segoe UI', system-ui, Arial, sans-serif;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 var(--sans); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* ---------- каркас ---------- */
#app { height: 100%; display: flex; flex-direction: column; }
.top { flex: none; display: flex; align-items: center; gap: 18px; padding: 10px 20px; background: var(--paper); border-bottom: 1px solid var(--line); }
.logo { font: 600 19px/1 var(--serif); letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.searchbox { flex: 1; max-width: 640px; }
.searchbox input { width: 100%; height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 19px; background: var(--bg); outline: none; }
.searchbox input:focus { border-color: var(--ink); background: #fff; box-shadow: 0 0 0 3px var(--ink-soft); }
.top-act { display: flex; gap: 8px; margin-left: auto; }
#banner { flex: none; display: flex; align-items: center; gap: 12px; padding: 9px 20px; background: #fff6df; border-bottom: 1px solid #ecd9a3; font-size: 13.5px; }
#banner span { flex: 1; }
.shell { flex: 1; min-height: 0; display: flex; }
.side-nav { flex: none; width: 262px; overflow-y: auto; padding: 14px 10px 30px; border-right: 1px solid var(--line); background: var(--paper); }
.main { flex: 1; min-width: 0; min-height: 0; }
.main.scroll { overflow-y: auto; }
.main.rec-main { overflow: hidden; }

/* ---------- кнопки и поля ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); cursor: pointer; font-weight: 500; white-space: nowrap; color: var(--text); }
.btn:hover { border-color: #b9bdca; background: #fafbfc; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: var(--ink-2); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger-o { color: var(--danger); }
.btn.small { height: 30px; padding: 0 11px; font-size: 13px; }
.btn.big { height: 46px; padding: 0 24px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: default; }
.in { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; outline: none; min-width: 0; }
.in:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ink-soft); }
.in.sm { padding: 5px 8px; font-size: 13px; width: auto; }
.in.yr { width: 90px; }
.in.big { font-size: 17px; padding: 10px 12px; }
textarea.in { resize: vertical; line-height: 1.4; }
.x { flex: none; width: 24px; height: 24px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 0; }
.x:hover { background: #fbe9e9; color: var(--danger); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--rc, var(--ink)); }
.empty-s { padding: 14px; color: var(--muted); font-size: 13.5px; }

.empty-page { padding: 80px 24px; text-align: center; }
.empty-page h2 { font: 600 28px var(--serif); margin-bottom: 10px; }
.empty-page p { color: var(--muted); margin: 0 0 20px; }

/* ---------- дерево категорий ---------- */
.tree-h { margin: 18px 10px 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tree-i { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r); color: var(--text); font-weight: 500; }
.tree-i:hover { background: var(--bg); }
.tree-i.on { background: var(--ink-soft); color: var(--ink-2); }
.tree-i .sw { flex: none; width: 4px; height: 18px; border-radius: 2px; background: var(--tc); }
.tree-i span { flex: 1; min-width: 0; }
.tree-i em { font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- страницы ---------- */
.page { max-width: 1040px; margin: 0 auto; padding: 36px 40px 80px; }
.page h2 { font: 600 20px var(--serif); margin: 38px 0 14px; }
.hero { font: 600 54px/1.05 var(--serif); letter-spacing: -.02em; color: var(--ink-2); margin-top: 18px; }
.hero-sub { font: 400 19px/1.5 var(--serif); color: var(--muted); max-width: 640px; margin: 14px 0 26px; }
.hero-act { display: flex; gap: 10px; }
.first { margin-top: 44px; padding: 24px 28px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; max-width: 720px; }
.first h2 { margin-top: 0; }
.first ol { margin: 0; padding-left: 20px; line-height: 1.7; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 16px 16px 14px; background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--tc); border-radius: 8px; color: var(--text); min-height: 118px; }
.tile:hover { border-color: var(--tc); box-shadow: 0 2px 10px rgba(20, 30, 60, .08); }
.tile b { font: 600 17px var(--serif); }
.tile small { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.tile em { position: absolute; top: 12px; right: 14px; font-style: normal; font-size: 12px; color: var(--muted); }
.cat-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 18px; padding-left: 16px; border-left: 6px solid var(--cc, var(--ink)); }
.cat-head h1 { font: 600 36px/1.1 var(--serif); letter-spacing: -.015em; }
.cat-head p { margin: 6px 0 0; max-width: 560px; }
.cat-act { display: flex; align-items: center; gap: 12px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 15px; background: var(--paper); cursor: pointer; font-size: 13px; }
.chip em { font-style: normal; color: var(--muted); font-size: 11.5px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip.on em { color: #c9d0ee; }
.chip.cc .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
.chip.cc.on { background: var(--tc); border-color: var(--tc); }
.chip.cc.on .sw { background: #fff; }
.chips.cats { margin-top: 4px; margin-bottom: 22px; }

/* ---------- список записей ---------- */
.rlist { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 16px 11px 18px; color: var(--text); border-bottom: 1px solid var(--line-2); border-left: 4px solid var(--rc); }
.row:last-child { border-bottom: 0; }
.row:hover { background: #f8f9fc; }
.row-main { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.row-main b { font: 600 16.5px/1.3 var(--serif); }
.row-main small { color: var(--muted); font-size: 12.5px; }
.row-side { display: flex; align-items: center; gap: 6px; flex: none; }
.rtype { font-size: 12px; color: var(--muted); }
.snip { color: var(--muted); font-size: 13px; line-height: 1.45; }
.snip mark, mark { background: #fff0a8; color: inherit; border-radius: 2px; padding: 0 1px; }
.flag { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.flag.nob { background: #fdeaea; color: var(--danger); }
.flag.one { background: #fff3d1; color: var(--amber); }
.flag.conf { background: #f6e1ef; color: #8a2a6a; }
.flag.catf { background: color-mix(in srgb, var(--tc) 14%, #fff); color: color-mix(in srgb, var(--tc) 80%, #000); }
.flags { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.recent { margin-top: 34px; }
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; margin: 18px 0 14px; padding: 14px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
.mf { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.mf.chk { flex-direction: row; align-items: center; gap: 7px; font-size: 13.5px; color: var(--text); height: 31px; }
.page.search h1 { font: 600 32px var(--serif); }
.sinfo { margin: 0 0 10px; }

/* ---------- хронология ---------- */
.tlist { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 0 12px; }
.tl-g { font: 600 22px var(--serif); padding: 18px 20px 6px; color: var(--ink-2); position: sticky; top: 0; background: var(--paper); z-index: 1; }
.te { display: grid; grid-template-columns: 130px 14px 1fr auto; align-items: baseline; gap: 10px; padding: 6px 20px; color: var(--text); }
.te:hover { background: #f8f9fc; }
.te-d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.te .dot { align-self: center; }
.te b { font: 600 15.5px var(--serif); }
.te-l { color: var(--muted); font-size: 12.5px; }

/* ---------- страница записи ---------- */
.rec { height: 100%; display: flex; flex-direction: column; }
.rec-head { flex: none; padding: 12px 22px 12px 20px; background: var(--paper); border-bottom: 1px solid var(--line); border-left: 8px solid var(--cc); }
.rec-top { display: flex; align-items: center; gap: 12px; }
.back { font-size: 13px; font-weight: 500; }
.back:hover { text-decoration: underline; }
.savestat { color: var(--muted); font-size: 12px; margin-left: auto; }
.rec-actions { display: flex; gap: 8px; }
.rec-title { display: block; width: 100%; margin: 4px 0 6px; padding: 2px 0; border: 0; border-bottom: 2px solid transparent; background: transparent; font: 600 34px/1.15 var(--serif); letter-spacing: -.015em; color: var(--text); outline: none; }
.rec-title:focus:not([readonly]) { border-bottom-color: var(--ink-soft); }
.rec-title::placeholder { color: #b6b9c4; }
.rec-meta { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 22px; }
.tags { display: inline-flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 10px; border-radius: 12px; font-size: 12.5px; background: color-mix(in srgb, var(--tc) 14%, #fff); color: color-mix(in srgb, var(--tc) 75%, #000); }
.tag button { border: 0; background: transparent; cursor: pointer; font-size: 15px; line-height: 1; color: inherit; padding: 0 4px; }
.rec-body { flex: 1; min-height: 0; display: flex; }
.board-host { flex: 1; min-width: 0; position: relative; }
.side { flex: none; width: 392px; overflow-y: auto; padding: 18px 20px 60px; background: var(--paper); border-left: 1px solid var(--line); }
.rec.noside .side { display: none; }
.side h3 { font: 600 19px var(--serif); margin: 0 0 12px; }
.side h3:not(:first-child) { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
.side h4, .modal h4 { font-size: 13px; font-weight: 600; margin: 18px 0 8px; }
.side h4:first-child { margin-top: 0; }

/* карточка */
.f { margin-bottom: 13px; }
.f.half { display: inline-block; width: calc(50% - 6px); vertical-align: top; }
.f.half + .f.half { margin-left: 8px; }
.f-lab { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12.5px; font-weight: 500; color: #3c4256; min-height: 22px; }
.f-lab > span:first-child { flex: none; }
.req { color: var(--danger); font-style: normal; margin-left: 2px; }
.src-chip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border: 1px dashed #c3c7d3; border-radius: 11px; background: transparent; font-size: 11.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.src-chip:hover { border-color: var(--ink); color: var(--ink); }
.src-chip.one { background: #fff3d1; border: 1px solid #ecd9a3; color: var(--amber); }
.src-chip.ok { background: #e4f3ea; border: 1px solid #bfe0cd; color: #1d6b3f; }
.src-chip.conf { box-shadow: 0 0 0 2px #f1cfe5; }
.conf-t { color: #8a2a6a; font-weight: 600; }
.fio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
.hint.now { margin-top: 6px; color: #3c4256; }
.warn { margin: -6px 0 12px; padding: 7px 10px; border-radius: var(--r); background: #fdeaea; color: var(--danger); font-size: 12.5px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.lrow { display: flex; flex-wrap: wrap; gap: 5px; align-items: flex-start; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); }
.lrow:last-of-type { border-bottom: 0; }
.lrow .x { margin-left: auto; }
.lcell { min-width: 0; }
.mainr { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); height: 34px; }
.lnk { position: relative; }
.lnk .in { padding-right: 28px; }
.lnk-go { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; border: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 15px; border-radius: 4px; }
.lnk-go:hover { background: var(--ink-soft); }
.lnk.linked .in { border-color: #b4bde0; background: #f7f8fd; }
.customs { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
.f-custom .clab { font-size: 12.5px; font-weight: 500; padding: 3px 6px; width: 46%; }
.links .rl { display: flex; align-items: center; gap: 4px; padding: 3px 0; }
.links .rl a { flex: 1; display: flex; align-items: baseline; gap: 8px; min-width: 0; color: var(--text); }
.links .rl a:hover span { text-decoration: underline; }
.links .rl a .dot { align-self: center; }
.links .rl small { color: var(--muted); font-size: 11.5px; margin-left: auto; white-space: nowrap; }
.links .btn { margin-top: 8px; }

/* ---------- доска ---------- */
.board { position: absolute; inset: 0; overflow: hidden; background-color: var(--board); background-image: radial-gradient(circle, #b8bcc8 1.1px, transparent 1.3px); outline: none; touch-action: none; user-select: none; cursor: default; }
.board.panning { cursor: grabbing; }
.board.drop { box-shadow: inset 0 0 0 3px var(--ink); }
.board-world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.board-empty { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: min(440px, 80%); text-align: center; color: #6d7388; pointer-events: none; }
.board-empty b { display: block; font: 600 24px var(--serif); color: #4b5168; margin-bottom: 8px; }
.board-empty span { font-size: 14px; line-height: 1.55; }
.board-pal { position: absolute; left: 14px; top: 14px; z-index: 5; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 2px 10px rgba(20, 30, 60, .1); }
.pal-btn { height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; text-align: left; font-weight: 500; font-size: 13px; }
.pal-btn:hover:not(:disabled) { background: var(--ink-soft); color: var(--ink-2); }
.pal-btn:disabled { opacity: .35; cursor: default; }
.pal-sep { height: 1px; background: var(--line); margin: 3px 4px; }
.board-bar { position: absolute; left: 158px; top: 14px; z-index: 6; display: flex; align-items: center; gap: 2px; width: max-content; max-width: calc(100% - 172px); flex-wrap: wrap; padding: 5px; background: var(--ink-2); border-radius: 9px; box-shadow: 0 4px 16px rgba(10, 20, 50, .3); }
.tb { height: 30px; min-width: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #e8ecfa; cursor: pointer; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.tb:hover { background: rgba(255, 255, 255, .14); }
.tb.b { font-weight: 800; } .tb.i { font-style: italic; font-family: var(--serif); } .tb.u { text-decoration: underline; }
.tb.danger:hover { background: #a32626; }
.tb-sep { width: 1px; height: 20px; background: rgba(255, 255, 255, .22); margin: 0 4px; }
.board-zoom { position: absolute; right: 14px; bottom: 14px; z-index: 5; display: flex; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 2px 10px rgba(20, 30, 60, .1); overflow: hidden; }
.board-zoom button { height: 34px; min-width: 34px; border: 0; background: transparent; cursor: pointer; padding: 0 10px; font-size: 15px; }
.board-zoom button:hover { background: var(--ink-soft); }
.board-zoom .zl { font-size: 12.5px; min-width: 54px; font-variant-numeric: tabular-nums; }
.board-zoom .wide { font-size: 12.5px; font-weight: 500; border-left: 1px solid var(--line); }
.marquee { position: absolute; z-index: 4; border: 1px solid var(--ink); background: rgba(27, 47, 107, .08); pointer-events: none; }

.blk { position: absolute; box-sizing: border-box; transform-origin: 50% 50%; cursor: grab; }
.blk.sel { outline: calc(2px * var(--inv, 1)) solid var(--ink); outline-offset: calc(2px * var(--inv, 1)); }
.blk.editing { cursor: text; }
.blk .grip { position: absolute; left: 0; right: 0; top: calc(-16px * var(--inv, 1)); height: calc(14px * var(--inv, 1)); display: none; background: var(--ink); border-radius: calc(4px * var(--inv, 1)) calc(4px * var(--inv, 1)) 0 0; cursor: grab; opacity: .9; }
.blk.sel .grip, .blk.editing .grip { display: block; }
.blk-body { outline: none; min-height: 1em; overflow-wrap: anywhere; word-break: normal; }
.blk-body:empty::before { content: attr(data-ph); color: #a7abb8; }
.blk-body[contenteditable="true"] { cursor: text; user-select: text; }
.blk-body p, .blk-body div { margin: 0; }
.blk-body h3 { font: 600 1.18em/1.25 var(--serif); margin: .5em 0 .25em; }
.blk-body blockquote { margin: .5em 0; padding: 0 0 0 14px; border-left: 3px solid var(--ink); font-style: italic; color: #394058; }
.blk-body ul, .blk-body ol { margin: .4em 0; padding-left: 1.4em; }
.k-text { padding: 12px 15px; background: var(--paper); font: 400 1em/1.6 var(--serif); box-shadow: 0 1px 2px rgba(20, 30, 60, .14), 0 6px 18px rgba(20, 30, 60, .06); border-radius: 2px; counter-reset: fn; }
.k-heading { padding: 4px 6px; font: 600 1em/1.15 var(--serif); letter-spacing: -.02em; color: var(--ink-2); counter-reset: fn; }
.k-caption { padding: 2px 4px; font: 400 1em/1.4 var(--sans); color: #4b5168; counter-reset: fn; }
.k-callout { padding: 14px 18px; background: var(--ink); color: #f1f3fb; font: 400 1em/1.55 var(--serif); border-radius: 2px; counter-reset: fn; box-shadow: 0 6px 18px rgba(20, 30, 60, .2); }
.k-callout a.rec-link { color: #fff; }
a.rec-link { color: var(--ink); border-bottom: 2px solid var(--lc, var(--ink)); cursor: pointer; text-decoration: none; }
a.rec-link:hover { background: var(--ink-soft); }
a.rec-link.broken { color: var(--danger); border-bottom-style: dashed; text-decoration: line-through; }
sup.fn { counter-increment: fn; color: var(--ink); cursor: pointer; font: 600 .7em var(--sans); padding: 0 1px; }
sup.fn::after { content: '[' counter(fn) ']'; }
.k-callout sup.fn { color: #cfd6f4; }
.k-image { background: #fff; padding: 6px; display: flex; flex-direction: column; box-shadow: 0 1px 3px rgba(20, 30, 60, .22), 0 8px 20px rgba(20, 30, 60, .1); border-radius: 1px; }
.k-image .img-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #eceef2; }
.k-image img { position: absolute; object-fit: cover; user-select: none; -webkit-user-drag: none; }
.k-image .cap { flex: none; padding: 6px 2px 1px; font: 400 12.5px/1.35 var(--sans); color: #3c4256; }
.k-image.missing .img-wrap::after { content: 'файл не найден'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.k-file { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(20, 30, 60, .14); border-radius: 3px; overflow: hidden; }
.file-ico { flex: none; width: 46px; height: 58px; display: grid; place-items: center; background: var(--ink-soft); color: var(--ink-2); font: 700 12px var(--sans); border-radius: 3px; border-top-right-radius: 14px; }
.file-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.file-info b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-info small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-act { display: flex; gap: 6px; margin-top: 4px; }
.blk-act { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
.blk-act:hover { border-color: var(--ink); color: var(--ink); }
.hdl { position: absolute; z-index: 3; width: calc(11px * var(--inv, 1)); height: calc(11px * var(--inv, 1)); background: #fff; border: calc(1.6px * var(--inv, 1)) solid var(--ink); border-radius: 2px; transform: translate(-50%, -50%); }
.hdl[data-d="nw"] { left: 0; top: 0; cursor: nwse-resize; } .hdl[data-d="n"] { left: 50%; top: 0; cursor: ns-resize; } .hdl[data-d="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
.hdl[data-d="e"] { left: 100%; top: 50%; cursor: ew-resize; } .hdl[data-d="se"] { left: 100%; top: 100%; cursor: nwse-resize; } .hdl[data-d="s"] { left: 50%; top: 100%; cursor: ns-resize; }
.hdl[data-d="sw"] { left: 0; top: 100%; cursor: nesw-resize; } .hdl[data-d="w"] { left: 0; top: 50%; cursor: ew-resize; }
.hdl.rot::before { content: ''; position: absolute; left: 50%; top: 100%; width: calc(1.6px * var(--inv, 1)); height: calc(22px * var(--inv, 1)); background: var(--ink); transform: translateX(-50%); }
.hdl.rot { left: 50%; top: calc(-34px * var(--inv, 1)); border-radius: 50%; cursor: grab; background: var(--ink); border-color: #fff; }
.crop-wrap { display: grid; place-items: center; padding: 8px; background: var(--board); border-radius: 8px; margin-bottom: 12px; }
.crop-box { position: relative; width: 320px; max-width: 100%; overflow: hidden; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); }
.crop-box img { position: absolute; object-fit: cover; }
.frow.rng { flex-direction: row; align-items: center; gap: 12px; }
.frow.rng span { width: 74px; }
.frow.rng input { flex: 1; }

/* ---------- окна и подсказки ---------- */
.modal-back { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(15, 20, 40, .42); padding: 20px; }
.modal { width: min(520px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--paper); border-radius: 12px; box-shadow: 0 20px 60px rgba(10, 15, 40, .35); }
.modal.wide { width: min(700px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 6px; }
.modal-head h3 { font: 600 22px/1.2 var(--serif); }
.modal-body { padding: 8px 22px 16px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px 18px; border-top: 1px solid var(--line-2); }
.p { margin: 0 0 12px; line-height: 1.55; }
.p.warnp { color: var(--danger); }
.frow { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; font-size: 13px; font-weight: 500; color: #3c4256; }
.frow.inline { flex-direction: row; align-items: center; gap: 10px; font-weight: 400; }
.frow small { font-weight: 400; }
.type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.type-grid.small { grid-template-columns: repeat(2, 1fr); }
.type-card { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; text-align: left; }
.type-card:hover { border-color: #aab2d4; }

'use strict';
/* ============ IndexedDB ============ */
const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort')); });
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('simbirsk-encyclopedia', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('records', { keyPath: 'id' });
        d.createObjectStore('media', { keyPath: 'id' });
        d.createObjectStore('blobs');
        d.createObjectStore('meta');
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Хранилище заблокировано другой вкладкой'));
    });
  },
  get: (st, k) => idbReq(DB.db.transaction(st).objectStore(st).get(k)),
  getAll: st => idbReq(DB.db.transaction(st).objectStore(st).getAll()),
  put(st, v, k) { const t = DB.db.transaction(st, 'readwrite'); const o = t.objectStore(st); k === undefined ? o.put(v) : o.put(v, k); return txDone(t); },
  del(st, k) { const t = DB.db.transaction(st, 'readwrite'); t.objectStore(st).delete(k); return txDone(t); },
  clear(st) { const t = DB.db.transaction(st, 'readwrite'); t.objectStore(st).clear(); return txDone(t); },
};

  srcIn: new Map(),     // id источника -> кто его использует

  urls: new Map(),      // id файла -> blob: URL
  app: { remindDays: 7, colors: {}, recent: [], lastExport: null, firstUse: null, snoozeUntil: null, ui: {} },

async function loadAll() {
  const [recs, media, app] = await Promise.all([DB.getAll('records'), DB.getAll('media'), DB.get('meta', 'app')]);
  if (app) Object.assign(S.app, app);
  S.app.colors = S.app.colors || {};
  S.app.recent = S.app.recent || []; S.app.ui = S.app.ui || {};
  if (!S.app.firstUse) { S.app.firstUse = nowISO(); saveApp(); }
  for (const m of media) registerMedia(m);
  for (const r of recs) { normalizeRecord(r); S.records.set(r.id, r); }
  for (const r of recs) reindex(r);
}
function normalizeRecord(r) {
  r.fields = r.fields || {}; r.facts = r.facts || {}; r.custom = r.custom || []; r.rel = r.rel || [];
  r.blocks = r.blocks || []; r.conns = r.conns || []; r.tags = r.tags || []; r.sub = r.sub || ''; r.title = r.title || '';
}
function saveApp() { return DB.put('meta', S.app, 'app').catch(e => console.error(e)); }

function registerMedia(m) {
  S.media.set(m.id, m);
  if (!S.mediaBy.has(m.recId)) S.mediaBy.set(m.recId, new Set());
  S.mediaBy.get(m.recId).add(m.id);
  if (m.hash) { if (!S.hashIdx.has(m.hash)) S.hashIdx.set(m.hash, new Set()); S.hashIdx.get(m.hash).add(m.id); }
}
function unregisterMedia(id) {
  const m = S.media.get(id); if (!m) return;
  S.mediaBy.get(m.recId)?.delete(id);
  S.hashIdx.get(m.hash)?.delete(id);
  S.media.delete(id);
  const u = S.urls.get(id); if (u) { URL.revokeObjectURL(u); S.urls.delete(id); }
}
async function mediaURL(id) {
  if (S.urls.has(id)) return S.urls.get(id);
  const b = await DB.get('blobs', id);
  if (!b) return null;
  const u = URL.createObjectURL(b); S.urls.set(id, u); return u;
}
async function deleteMediaFully(id) {
  unregisterMedia(id);
  try { await DB.del('media', id); await DB.del('blobs', id); } catch (e) { console.error(e); }
}

/* ============ Связи и источники ============ */
function extractRefs(rec) {
  const links = new Set(), srcs = new Set();
  (function walk(v) {
    if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === 'object') { if (typeof v.r === 'string' && v.r) links.add(v.r); for (const k in v) walk(v[k]); }
  })(rec.fields);
  for (const r of rec.rel || []) if (r.r) links.add(r.r);
  for (const k in rec.facts) {
    const f = rec.facts[k];
    (f.s || []).forEach(x => x.src && srcs.add(x.src));
    (f.alt || []).forEach(a => (a.s || []).forEach(x => x.src && srcs.add(x.src)));
  }
  for (const b of rec.blocks) if (b.html) {
    for (const m of b.html.matchAll(/data-rec="([^"]+)"/g)) links.add(m[1]);
    for (const m of b.html.matchAll(/data-src="([^"]+)"/g)) srcs.add(m[1]);
  }
  for (const mid of S.mediaBy.get(rec.id) || []) { const m = S.media.get(mid); (m.source || []).forEach(x => x.src && srcs.add(x.src)); }
  links.delete(rec.id); srcs.delete(rec.id);
  return { links, srcs };
}
function reindex(rec) {
  const old = S.refs.get(rec.id);
  if (old) { old.links.forEach(t => S.inn.get(t)?.delete(rec.id)); old.srcs.forEach(t => S.srcIn.get(t)?.delete(rec.id)); }
  const nw = extractRefs(rec); S.refs.set(rec.id, nw);
  nw.links.forEach(t => { if (!S.inn.has(t)) S.inn.set(t, new Set()); S.inn.get(t).add(rec.id); });
  nw.srcs.forEach(t => { if (!S.srcIn.has(t)) S.srcIn.set(t, new Set()); S.srcIn.get(t).add(rec.id); });
}

const catOf = rec => catInfo(rec.cat);
function newRecord({ type, cat, title, fields }) {
  const t = TYPES[type];
  const rec = {
    id: uid(), type, cat: t.fixed || cat || t.cat, sub: '', tags: [], title: title || '',
    fields: fields || {}, facts: {}, custom: [], rel: [], blocks: [], conns: [], view: null,
    created: nowISO(), updated: nowISO(), ver: 1,
  };
  S.records.set(rec.id, rec); reindex(rec);
  S.pending.add(rec.id); clearTimeout(saveT); saveT = setTimeout(flushSaves, 100);
  return rec;
}
function stubFields(type, title) {
  if (type !== 'person') return {};
  const w = title.trim().split(/\s+/);
  const f = { lastName: w[0] || '' };
  if (w[1]) f.firstName = w[1];
  if (w.length > 2) f.patronymic = w.slice(2).join(' ');
  return f;
}
function createRecordFromTitle(type, title, cat) {
  const fields = stubFields(type, title);
  return newRecord({ type, cat, title: type === 'person' ? personTitle(fields) || title : title, fields });
}
async function deleteRecord(id) {
  const rec = S.records.get(id); if (!rec) return;
  for (const mid of Array.from(S.mediaBy.get(id) || [])) await deleteMediaFully(mid);
  S.mediaBy.delete(id);
  const old = S.refs.get(id);
  if (old) { old.links.forEach(t => S.inn.get(t)?.delete(id)); old.srcs.forEach(t => S.srcIn.get(t)?.delete(id)); }
  S.refs.delete(id); S.inn.delete(id); S.srcIn.delete(id);
  S.records.delete(id); S.idx.delete(id); S.pending.delete(id);
  S.app.recent = S.app.recent.filter(x => x !== id); saveApp();
  if (rec.type === 'source') S.idx.clear();
  await DB.del('records', id);
}

function recsInCat(k) {
  const out = [];
  for (const r of S.records.values()) if (r.cat === k || r.tags.includes(k)) out.push(r);
  return out;

function countByCat() {
  const c = {};
  for (const r of S.records.values()) { c[r.cat] = (c[r.cat] || 0) + 1; for (const t of r.tags) if (t !== r.cat) c[t] = (c[t] || 0) + 1; }

/* Поиск записи по названию (для @-ссылок и подсказок) */
function recSearch(q, opts = {}) {
  const n = norm(q).trim(), types = opts.types, lim = opts.limit || 8, ex = opts.exclude;
  const a = [], b = [];
  for (const r of S.records.values()) {
    if (types && !types.includes(r.type)) continue;
    if (!types && (r.type === 'source' || r.type === 'media' || r.type === 'note') && !opts.all) continue;
    if (ex && r.id === ex) continue;
    const t = norm(r.title);
    if (!n) { a.push(r); continue; }
    const i = t.indexOf(n);
    if (i === 0) a.push(r); else if (i > 0) b.push(r);
    else if (r.type === 'person') { const alt = norm(flattenText([r.fields.altNames, r.fields.formerName]).join(' ')); if (alt.includes(n)) b.push(r); }
  }
  const sorter = (x, y) => ruCollator.compare(x.title, y.title);
  return a.sort(sorter).concat(b.sort(sorter)).slice(0, lim);
}

/* ============ Тексты для поиска ============ */
function indexText(rec) {
  let t = S.idx.get(rec.id); if (t !== undefined) return t;
  const p = [rec.title, rec.sub];
  flattenText(rec.fields, p);
  for (const c of rec.custom) { p.push(c.label || '', c.value || ''); }
  for (const b of rec.blocks) if (b.html) p.push(htmlToText(b.html));
  for (const mid of S.mediaBy.get(rec.id) || []) { const m = S.media.get(mid); p.push(m.name, m.caption || '', m.author || '', m.origin || ''); }
  const refs = S.refs.get(rec.id);
  if (refs) for (const s of refs.srcs) { const sr = S.records.get(s); if (sr) p.push(sr.title, sr.fields.author || ''); }
  for (const k in rec.facts) for (const a of rec.facts[k].alt || []) p.push(a.v || '');
  t = norm(p.join('\n')); S.idx.set(rec.id, t); return t;
}

/* ============ Метки качества ============ */
function recFlags(rec) {
  const f = { noBasis: false, one: false, conflict: false };
  if (rec.type === 'person') { const x = rec.fields; if (!x.cityRelation || !x.cityPeriod) f.noBasis = true; }
  for (const k in rec.facts) {
    const ft = rec.facts[k];
    if ((ft.s || []).length === 1) f.one = true;
    if ((ft.alt || []).length) f.conflict = true;
  }
  return f;
}

/* ============ Даты записи ============ */
function recDateEntries(rec) {
  const out = [];
  for (const d of FIELDS[rec.type] || []) {
    if (!d.tl) continue;
    const v = rec.fields[d.k]; const p = parseDate(v);
    if (!p) continue;
    let label = d.tl;
    if ((rec.type === 'event' || rec.type === 'incident') && rec.fields.kind) label = rec.fields.kind;
    else if (rec.type === 'event') label = 'событие'; else if (rec.type === 'incident') label = 'происшествие';
    out.push({ ...p, text: String(v).trim(), label, rec });
  }
  return out;
}
function recYears(rec) {
  const ys = [];
  for (const d of FIELDS[rec.type] || []) if (d.t === 'date') { const p = parseDate(rec.fields[d.k]); if (p) ys.push(p.y); }
  if (rec.type === 'person') for (const m of String(rec.fields.cityPeriod || '').matchAll(/(1[0-9]{3}|20[0-9]{2})/g)) ys.push(+m[1]);
  return ys;
}

/* ============ Подписи для списков ============ */
const clip = (s, n) => { s = String(s || '').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function addrText(a) { return [a.street && (a.street.t || ''), a.house].filter(Boolean).join(', '); }
function mainAddr(list) { if (!Array.isArray(list) || !list.length) return ''; const m = list.find(x => x.main) || list[list.length - 1]; return addrText(m); }
function lastRow(list, k) { if (!Array.isArray(list)) return ''; for (let i = list.length - 1; i >= 0; i--) if (list[i][k]) return list[i][k]; return ''; }
function subtitle(rec) {
  const f = rec.fields;
  switch (rec.type) {
    case 'person': {
      const b = clip(f.born, 14), d = clip(f.died, 14);
      return [(b || d) ? (b || '?') + '–' + (d || '?') : '', clip(f.occupation, 40)].filter(Boolean).join(', ');
    }
    case 'building': return [mainAddr(f.addresses), clip(f.builtDate, 16)].filter(Boolean).join(', ');
    case 'event': case 'incident': return [clip(f.date, 20), f.kind].filter(Boolean).join(', ');
    case 'geo': return [f.kind, f.district && f.district.t].filter(Boolean).join(', ');
    case 'org': return [f.activity && clip(f.activity, 36), f.founded && ('основана ' + clip(f.founded, 12))].filter(Boolean).join(', ');
    case 'source': return [f.kind, clip(f.author, 30), clip(f.sdate, 14)].filter(Boolean).join(', ');
    case 'media': return [clip(f.mdate, 14), clip(f.description, 50)].filter(Boolean).join(', ');
    default: return '';
  }
}

/* ============ Всплывающие сообщения ============ */
function toast(msg, o = {}) {
  let box = $('#toasts'); if (!box) { box = el('div', { id: 'toasts' }); document.body.append(box); }
  const t = el('div', { class: 'toast' + (o.error ? ' err' : '') }, el('span', {}, msg));
  if (o.action) t.append(el('button', { onclick: () => { o.action.fn(); t.remove(); } }, o.action.label));
  box.append(t);
  setTimeout(() => t.remove(), o.ms || (o.action ? 9000 : o.error ? 9000 : 4500));
}

/* ============ Модальные окна ============ */
const modals = [];
function modal({ title, body, actions = [], wide, onClose, hideClose }) {
  const back = el('div', { class: 'modal-back' });
  const box = el('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog' });
  const m = {
    el: box, back, closed: false,
    close(v) { if (m.closed) return; m.closed = true; const i = modals.indexOf(m); if (i >= 0) modals.splice(i, 1); back.remove(); onClose && onClose(v); },
  };
  const head = el('div', { class: 'modal-head' }, el('h3', {}, title || ''));
  if (!hideClose) head.append(el('button', { class: 'x', title: 'Закрыть', onclick: () => m.close() }, '×'));
  const bd = el('div', { class: 'modal-body' }, body);
  box.append(head, bd);
  if (actions.length) {
    const foot = el('div', { class: 'modal-foot' });
    for (const a of actions) foot.append(el('button', { class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), onclick: () => a.onClick ? a.onClick(m) : m.close() }, a.label));
    box.append(foot);
  }
  back.addEventListener('mousedown', e => { if (e.target === back) m.close(); });
  back.append(box); document.body.append(back); modals.push(m);
  setTimeout(() => { const f = box.querySelector('[autofocus],input:not([type=checkbox]),textarea,select'); f && f.focus(); }, 30);
  return m;
}
function confirmDialog(text, ok = 'Да', danger = false, title = 'Подтверждение') {
  return new Promise(res => {
    let done = false;
    modal({
      title, body: el('p', { class: 'p' }, text),
      actions: [{ label: 'Отмена', onClick: m => m.close() }, { label: ok, primary: !danger, danger, onClick: m => { done = true; m.close(); } }],
      onClose: () => res(done),
    });
  });
}

/* ============ Выпадающий список подсказок ============ */
const Pop = {
  box: null, items: [], idx: 0,
  open(rect, items) {
    this.close();
    if (!items.length) return;
    this.items = items; this.idx = 0;
    const b = this.box = el('div', { class: 'pop' });
    items.forEach((it, i) => {
      const row = el('div', { class: 'pop-i' + (it.create ? ' create' : '') + (i === 0 ? ' on' : ''), onmousedown: e => { e.preventDefault(); this.pick(i); } },
        it.color ? el('i', { class: 'dot', style: { background: it.color } }) : null,
        el('span', { class: 'pop-l' }, it.label), it.sub ? el('small', {}, it.sub) : null);
      b.append(row);
    });
    document.body.append(b);
    const bw = b.offsetWidth, bh = b.offsetHeight;
    let left = rect.left, top = rect.bottom + 4;
    if (left + bw > innerWidth - 8) left = Math.max(8, innerWidth - bw - 8);
    if (top + bh > innerHeight - 8) top = Math.max(8, rect.top - bh - 4);
    b.style.left = left + 'px'; b.style.top = top + 'px';
    if (rect.width && rect.width > bw) b.style.minWidth = rect.width + 'px';
  },
  close() { if (this.box) { this.box.remove(); this.box = null; this.items = []; } },
  mark() { $$('.pop-i', this.box).forEach((r, i) => r.classList.toggle('on', i === this.idx)); $('.pop-i.on', this.box)?.scrollIntoView({ block: 'nearest' }); },
  pick(i) { const it = this.items[i]; this.close(); it && it.run(); },
  key(e) {
    if (!this.box) return false;
    if (e.key === 'ArrowDown') { this.idx = (this.idx + 1) % this.items.length; this.mark(); e.preventDefault(); return true; }
    if (e.key === 'ArrowUp') { this.idx = (this.idx - 1 + this.items.length) % this.items.length; this.mark(); e.preventDefault(); return true; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); this.pick(this.idx); return true; }
    if (e.key === 'Escape') { e.preventDefault(); this.close(); return true; }
    return false;
  },
};
document.addEventListener('mousedown', e => { if (Pop.box && !Pop.box.contains(e.target) && !e.target.closest('.lnk')) Pop.close(); });

/* ============ Поле-ссылка на другую запись ============ */
function linkInput(val, lt, ph, onChange) {
  const cur = (val && typeof val === 'object') ? { t: val.t || '', r: val.r || '' } : { t: val || '', r: '' };
  const wrap = el('div', { class: 'lnk' });
  const inp = el('input', { class: 'in', value: cur.t, placeholder: ph || '' });
  const go = el('button', { class: 'lnk-go', title: 'Открыть запись', onclick: () => { if (cur.r && S.records.has(cur.r)) location.hash = '#/rec/' + cur.r; } }, '↗');
  const refresh = () => { const ok = !!(cur.r && S.records.has(cur.r)); go.hidden = !ok; wrap.classList.toggle('linked', ok); };
  const emit = () => onChange({ t: cur.t, r: cur.r });
  const pick = r => { cur.t = r.title; cur.r = r.id; inp.value = r.title; emit(); refresh(); };
  const suggest = () => {
    const q = inp.value.trim();
    const items = recSearch(q, { types: lt, limit: 7 }).map(r => ({ label: r.title, sub: typeLabel(r.type), color: catOf(r).c, run: () => pick(r) }));
    if (q.length > 1 && !items.some(i => norm(i.label) === norm(q))) {
      items.push({
        label: 'Создать запись «' + clip(q, 36) + '»', create: true,
        run: async () => { const r = await quickCreate(q, lt && lt.length ? lt : undefined); if (r) pick(r); },
      });
    }
    Pop.open(inp.getBoundingClientRect(), items);
  };
  inp.addEventListener('input', () => {
    cur.t = inp.value;
    if (cur.r) { const rr = S.records.get(cur.r); if (!rr || rr.title !== cur.t) cur.r = ''; }
    emit(); refresh(); suggest();
  });
  inp.addEventListener('keydown', e => { Pop.key(e); });
  inp.addEventListener('blur', () => {
    setTimeout(() => Pop.close(), 120);
    if (!cur.r && cur.t.trim()) {
      const ex = recSearch(cur.t, { types: lt, limit: 50 }).filter(r => norm(r.title) === norm(cur.t.trim()));
      if (ex.length === 1) pick(ex[0]);
    }
  });
  wrap.append(inp, go); refresh();
  return wrap;
}

  /* Свои поля */

        el('div', { class: 'f-lab' },

          srcChip(rec, c.id, 'Своё поле', () => (c.label || '') + ': ' + (c.value || ''), onChange),
          el('button', { class: 'x', title: 'Удалить поле', onclick: async () => { if (await confirmDialog('Удалить поле «' + (c.label || 'без названия') + '» вместе с его источниками?', 'Удалить', true)) { rec.custom.splice(i, 1); delete rec.facts[c.id]; drawCustom(); changed(); } } }, '×')),
        el('textarea', { class: 'in', rows: 1, placeholder: 'Значение', oninput: e => { c.value = e.target.value; changed(); } }, c.value || '')));
    });
    customBox.append(el('button', { class: 'btn small', onclick: () => { rec.custom.push({ id: 'c' + uid(), label: '', value: '' }); drawCustom(); const l = customBox.querySelectorAll('.clab'); l[l.length - 1]?.focus(); } }, '+ Своё поле'));
  };
  drawCustom();
  host.append(customBox);
}

'use strict';
/* ============ Вспомогательное для файлов ============ */
function imgSize(f) {
  return new Promise(res => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => { res({ w: im.naturalWidth, h: im.naturalHeight }); URL.revokeObjectURL(u); };
    im.onerror = () => { res({ w: 0, h: 0 }); URL.revokeObjectURL(u); };
    im.src = u;
  });
}
async function openMedia(mid) { const u = await mediaURL(mid); if (u) window.open(u, '_blank'); else toast('Файл не найден в хранилище', { error: true }); }
async function downloadMedia(mid) {
  const u = await mediaURL(mid), m = S.media.get(mid); if (!u) return toast('Файл не найден в хранилище', { error: true });
  const a = el('a', { href: u, download: m.name }); document.body.append(a); a.click(); a.remove();
}

/* Сведения о файле: подпись, источник, дата, автор */

    f('Подпись', el('textarea', { class: 'in', rows: 2, oninput: e => { m.caption = e.target.value; } }, m.caption || '')),
    f('Дата создания', el('input', { class: 'in', value: m.date || '', placeholder: 'например, около 1910', oninput: e => { m.date = e.target.value; } })),
    f('Автор', el('input', { class: 'in', value: m.author || '', oninput: e => { m.author = e.target.value; } })),
    f('Откуда получено', el('input', { class: 'in', value: m.origin || '', placeholder: 'архив, книга, личная коллекция…', oninput: e => { m.origin = e.target.value; } })),
    el('h4', {}, 'Источники'), srcListEditor(m.source, () => { }),
  ];

    onClose: async () => { await putMediaMeta(m); const r = S.records.get(m.recId); if (r) touch(r); after && after(); },
  });
}

/* ============ Доска ============ */
const PH = { text: 'Текст. Наберите @, чтобы связать с записью', heading: 'Заголовок', caption: 'Подпись', callout: 'Врезка' };
const SIZES = { text: { w: 320, h: 60 }, heading: { w: 480, h: 56 }, caption: { w: 240, h: 28 }, callout: { w: 340, h: 90 } };
const KIND_NAMES = { text: 'Текст', heading: 'Заголовок', caption: 'Подпись', callout: 'Врезка' };

class Board {
  constructor(rec, host, onChange) {
    this.rec = rec; this.host = host; this.onChange = onChange || (() => { });

  }

  /* ----- каркас ----- */

    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); this.svg.setAttribute('class', 'board-conns'); this.world.append(this.svg);
    this.marq = el('div', { class: 'marquee', hidden: true });

      el('button', { title: 'Увеличить', onclick: () => this.zoomCenter(1.25) }, '+'),
      el('button', { class: 'wide', onclick: () => this.fit() }, 'Показать всё'));

    r.addEventListener('pointerdown', e => this.onDown(e));
    r.addEventListener('pointermove', e => this.onMove(e));
    r.addEventListener('pointerup', e => this.onUp(e));
    r.addEventListener('pointercancel', e => { this.drag = null; r.classList.remove('panning'); });
    r.addEventListener('wheel', e => this.onWheel(e), { passive: false });

  }

  /* ----- координаты и вид ----- */
  pt(e) { const r = this.root.getBoundingClientRect(); return { x: (e.clientX - r.left - this.view.x) / this.view.z, y: (e.clientY - r.top - this.view.y) / this.view.z }; }

  applyView() {
    const { x, y, z } = this.view;
    this.world.style.transform = `translate(${x}px,${y}px) scale(${z})`;
    this.root.style.setProperty('--inv', 1 / z);
    const g = 28 * z; this.root.style.backgroundSize = g + 'px ' + g + 'px'; this.root.style.backgroundPosition = x + 'px ' + y + 'px';
    this.zl.textContent = Math.round(z * 100) + '%';
    if (this.rec.conns.length) this.drawConns();
    this.saveViewD();
  }
  zoomAt(cx, cy, nz) {
    nz = clamp(nz, 0.08, 4); const r = this.root.getBoundingClientRect(), px = cx - r.left, py = cy - r.top, k = nz / this.view.z;
    this.view.x = px - (px - this.view.x) * k; this.view.y = py - (py - this.view.y) * k; this.view.z = nz; this.applyView();
  }
  zoomCenter(f) { const r = this.root.getBoundingClientRect(); this.zoomAt(r.left + r.width / 2, r.top + r.height / 2, this.view.z * f); }
  fit() {
    const W = this.root.clientWidth, H = this.root.clientHeight; if (!W) return;

    if (TEXT_KINDS.includes(kind)) { b.html = b.html || ''; }

  }

        const hash = await fileHash(f);
        const dupId = Array.from(S.hashIdx.get(hash) || []).find(x => S.media.get(x) && S.media.get(x).recId !== this.rec.id);
        const mid = uid();
        const meta = { id: mid, recId: this.rec.id, name: f.name || ('вставка-' + mid + '.' + ((f.type.split('/')[1]) || 'bin')), mime: f.type || 'application/octet-stream', size: f.size, hash, caption: '', author: '', date: '', origin: '', source: [], nw: 0, nh: 0, added: nowISO() };
        let w = 260, h = 84;
        if (isImg) { const d = await imgSize(f); meta.nw = d.w; meta.nh = d.h; w = Math.min(d.w || 360, 420); h = Math.round(w * (d.h || 240) / (d.w || 360)); }
        await DB.put('blobs', f, mid); await DB.put('media', meta); registerMedia(meta);
        const b = this.mkBlock(isImg ? 'image' : 'file', { x: c.x - w / 2 + i * 28, y: c.y - h / 2 + i * 28, w, h, mid });

  /* ----- блоки: отображение ----- */
  renderAll() {

  }
  geom(b, e) {

  }
  makeEl(b) {

    if (TEXT_KINDS.includes(b.k)) {

      const body = el('div', { class: 'blk-body', 'data-ph': PH[b.k], html: sanitizeHtml(b.html || '') });
      body.addEventListener('input', () => this.onInput(b, body));
      body.addEventListener('keydown', ev => this.onBodyKey(ev, b));
      body.addEventListener('blur', () => { if (!this.suspend && this.editing && this.editing.b === b) this.endEdit(); });

  }
  paintImage(b, e) {

    const sw = Math.max(0.05, 1 - c.l - c.r), sh = Math.max(0.05, 1 - c.t - c.b);
    img.style.width = (100 / sw) + '%'; img.style.height = (100 / sh) + '%'; img.style.left = (-c.l / sw * 100) + '%'; img.style.top = (-c.t / sh * 100) + '%';
    img.alt = m.caption || m.name || '';

    e.append(el('div', { class: 'file-ico' }, ext), el('div', { class: 'file-info' }, el('b', {}, m.name), el('small', {}, fmtBytes(m.size || 0) + (m.caption ? ', ' + m.caption : '')),
      el('div', { class: 'file-act' }, el('button', { class: 'blk-act', onclick: () => openMedia(b.mid) }, 'Открыть'), el('button', { class: 'blk-act', onclick: () => downloadMedia(b.mid) }, 'Сохранить'))));
  }

  /* ----- выделение ----- */

  }

    this.rec.conns.push(c); this.sel = new Set(); this.selConn = c.id; this.paintSel(); this.commit();
  }
  delConn(id) { this.rec.conns = this.rec.conns.filter(c => c.id !== id); this.selConn = null; this.paintSel(); this.commit(); }
  connLabel(c) {
    const inp = el('input', { class: 'in big', value: c.label || '', placeholder: 'Например: жил в, учредил, преемник', autofocus: true });
    const done = m => { c.label = inp.value.trim(); m.close(); this.drawConns(); this.commit(); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(m); });
    const m = modal({ title: 'Подпись на линии', body: inp, actions: [{ label: 'Отмена' }, { label: 'Готово', primary: true, onClick: done }] });
  }
  rectOf(b) {
    const e = this.el(b.id), h = TEXT_KINDS.includes(b.k) && e ? Math.max(b.h, e.offsetHeight) : b.h;
    return { cx: b.x + b.w / 2, cy: b.y + h / 2, hw: b.w / 2, hh: h / 2, r: (b.r || 0) * Math.PI / 180 };
  }
  anchor(R, tx, ty) {
    const dx = tx - R.cx, dy = ty - R.cy, cos = Math.cos(R.r), sin = Math.sin(R.r);
    const lx = dx * cos + dy * sin, ly = -dx * sin + dy * cos;
    const sx = Math.abs(lx) > 1e-6 ? R.hw / Math.abs(lx) : 1e9, sy = Math.abs(ly) > 1e-6 ? R.hh / Math.abs(ly) : 1e9;
    let t, nx, ny;
    if (sx < sy) { t = sx; nx = Math.sign(lx); ny = 0; } else { t = sy; nx = 0; ny = Math.sign(ly) || 1; }
    const px = lx * t, py = ly * t;
    return { x: R.cx + px * cos - py * sin, y: R.cy + px * sin + py * cos, nx: nx * cos - ny * sin, ny: nx * sin + ny * cos };
  }
  drawConns() {
    const svg = this.svg; svg.innerHTML = '';
    const NS = 'http://www.w3.org/2000/svg', mk = (n, a) => { const x = document.createElementNS(NS, n); for (const k in a) x.setAttribute(k, a[k]); return x; };
    const z = this.view.z;
    for (const c of this.rec.conns) {
      const A = this.block(c.a), Bk = this.block(c.b); if (!A || !Bk) continue;
      const RA = this.rectOf(A), RB = this.rectOf(Bk);
      const p1 = this.anchor(RA, RB.cx, RB.cy), p2 = this.anchor(RB, RA.cx, RA.cy);
      const k = clamp(Math.hypot(p2.x - p1.x, p2.y - p1.y) * 0.4, 30, 240);
      const c1 = { x: p1.x + p1.nx * k, y: p1.y + p1.ny * k }, c2 = { x: p2.x + p2.nx * k, y: p2.y + p2.ny * k };
      const d = `M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`;
      const sel = this.selConn === c.id;
      svg.append(mk('path', { d, class: 'conn' + (sel ? ' sel' : '') + (c.dash ? ' dash' : '') }));
      if (c.arrow) {
        const ux = p2.x - c2.x, uy = p2.y - c2.y, L = Math.hypot(ux, uy) || 1, tx = ux / L, ty = uy / L, s = 13 / z, w = 5.5 / z;
        const bx = p2.x - tx * s, by = p2.y - ty * s;
        svg.append(mk('path', { d: `M${p2.x},${p2.y} L${bx - ty * w},${by + tx * w} L${bx + ty * w},${by - tx * w} Z`, class: 'conn-arrow' + (sel ? ' sel' : '') }));
      }
      if (c.label) {
        const mx = (p1.x + 3 * c1.x + 3 * c2.x + p2.x) / 8, my = (p1.y + 3 * c1.y + 3 * c2.y + p2.y) / 8;
        const t = mk('text', { x: mx, y: my, class: 'conn-lab', 'text-anchor': 'middle', 'dominant-baseline': 'central' }); t.textContent = c.label; svg.append(t);
      }
      svg.append(mk('path', { d, class: 'conn-hit', 'data-id': c.id }));
    }
  }

  /* ----- история изменений ----- */
  snapStr() { return JSON.stringify({ b: this.rec.blocks, c: this.rec.conns }); }
  snap() { this.states = [this.snapStr()]; this.si = 0; this.paintUndo(); }
  commit() {
    const s = this.snapStr();
    if (this.states[this.si] !== s) {
      this.states = this.states.slice(0, this.si + 1); this.states.push(s);
      if (this.states.length > 80) this.states.shift();
      this.si = this.states.length - 1;
    }
    touch(this.rec); this.onChange(); this.paintUndo();
  }
  restore() {
    if (this.editing) this.endEdit();
    const o = JSON.parse(this.states[this.si]); this.rec.blocks = o.b; this.rec.conns = o.c || []; this.selConn = null; this.renderAll(); touch(this.rec); this.onChange(); this.paintUndo();
  }
  undo() { if (this.si > 0) { this.si--; this.restore(); } }
  redo() { if (this.si < this.states.length - 1) { this.si++; this.restore(); } }
}

async function gcMedia(recId) {

}

function flagChips(rec) {

function renderLinks(rec, host) {
  host.innerHTML = '';
  const item = (r, extra) => el('div', { class: 'rl' },
    r && r.title !== undefined
      ? el('a', { href: '#/rec/' + r.id }, el('i', { class: 'dot', style: { background: catOf(r).c } }), el('span', {}, r.title || 'Без названия'), el('small', {}, typeLabel(r.type)))
      : el('span', { class: 'muted' }, '(запись удалена)'), extra);
  const refs = S.refs.get(rec.id) || { links: new Set(), srcs: new Set() };
  const manual = new Set(rec.rel.map(x => x.r));
  const out = Array.from(refs.links).map(i => S.records.get(i)).filter(r => r && r.type !== 'source').sort((a, b) => ruCollator.compare(a.title, b.title));
  const sec = (h, kids, empty) => { host.append(el('h4', {}, h)); if (kids.length) kids.forEach(k => host.append(k)); else host.append(el('p', { class: 'p muted small' }, empty)); };
  sec('Эта запись ссылается на', out.map(r => item(r, manual.has(r.id) ? el('button', { class: 'x', title: 'Убрать связь', onclick: () => { rec.rel = rec.rel.filter(x => x.r !== r.id); touch(rec); renderLinks(rec, host); } }, '×') : null)),

  sec('Ссылаются на эту запись', inn.map(r => item(r)), 'Пока никто не ссылается.');
  if (rec.type === 'source') {

  } else {

    sec('Источники этой записи', srcs.map(r => item(r)), 'Источники не указаны.');
  }

    }).join('');
    return rows ? '<ul>' + rows + '</ul>' : '';
  }
  return '';
}

const README = `ЭНЦИКЛОПЕДИЯ СИМБИРСКА И УЛЬЯНОВСКА: выгрузка

Как устроен архив
- «Оглавление.html» — откройте двойным щелчком: список всех записей со ссылками.
- Папки верхнего уровня — основные категории. Внутри могут быть подкатегории.
- Одна запись = одна папка с тремя частями:
    текст.html   — запись в читаемом виде (карточка, текст, связи, источники),
    данные.json  — полные данные записи, включая раскладку доски; по ним программа восстанавливает записи,
    медиа        — копии фотографий и документов этой записи.
- manifest.json — служебные сведения о выгрузке.

Как восстановить данные
В программе: меню «Ещё» → «Загрузить из архива». Выберите этот ZIP-файл.
Не переименовывайте и не удаляйте файлы «данные.json» внутри архива.

Все материалы можно открывать и копировать без программы.
`;

function ymd() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

async function exportAll() {
  if (curBoard) curBoard.endEdit();
  await flushSaves();
  const total = S.records.size;
  if (!total) { toast('Пока нечего выгружать: записей нет.'); return; }
  const msg = el('p', { class: 'p' }, 'Собираю архив…'), bar = el('div', { class: 'prog' }, el('i', {}));
  const m = modal({ title: 'Выгрузка', body: [msg, bar], hideClose: true });
  const tick = (i, t) => { msg.textContent = t || ('Записей обработано: ' + i + ' из ' + total); $('i', bar).style.width = Math.round(i / total * 100) + '%'; };
  try {
    const zw = new ZipWriter(), paths = planPaths(), warns = [];
    const pre = ROOT_DIR + '/';
    await zw.add(pre + 'README.txt', README, { compress: true });
    await zw.add(pre + 'Оглавление.html', indexHtml(paths), { compress: true });
    await zw.add(pre + 'manifest.json', JSON.stringify({ format: 'simbirsk-encyclopedia', ver: 1, exported: nowISO(), records: total, settings: { remindDays: S.app.remindDays, colors: S.app.colors } }, null, 1), { compress: true });
    let i = 0;
    for (const rec of S.records.values()) {
      const dir = pre + paths.get(rec.id).join('/') + '/';
      const files = new Map(), used = new Set(), metas = [];
      for (const mid of S.mediaBy.get(rec.id) || []) {
        const mt = S.media.get(mid); if (!mt) continue;
        const blob = await DB.get('blobs', mid);
        if (!blob) { warns.push('Нет файла: ' + mt.name + ' (запись «' + rec.title + '»)'); continue; }
        const base = safeName(mt.name, 90).replace(/\.+$/, '') || 'файл'; let fn = base, k = 2;
        const dot = base.lastIndexOf('.'), stem = dot > 0 ? base.slice(0, dot) : base, ext = dot > 0 ? base.slice(dot) : '';
        while (used.has(norm(fn))) fn = stem + ' (' + (k++) + ')' + ext;
        used.add(norm(fn)); files.set(mid, fn); metas.push({ ...mt, file: fn });
        await zw.add(dir + 'медиа/' + fn, blob);
      }
      await zw.add(dir + 'данные.json', JSON.stringify({ format: 'simbirsk-encyclopedia', ver: 1, record: rec, media: metas }), { compress: true });
      await zw.add(dir + 'текст.html', recordHtml(rec, { paths, files }), { compress: true });
      if (++i % 20 === 0) { tick(i); await new Promise(r => setTimeout(r, 0)); }
    }
    tick(total, 'Упаковываю…'); await new Promise(r => setTimeout(r, 30));
    const blob = zw.finish(), name = 'Энциклопедия-' + ymd() + '.zip';
    const u = URL.createObjectURL(blob), a = el('a', { href: u, download: name }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 120000);
    S.app.lastExport = nowISO(); S.app.snoozeUntil = null; await saveApp(); updateBanner();
    m.close();
    modal({
      title: 'Архив готов',
      body: [el('p', { class: 'p' }, 'Файл «' + name + '» (' + fmtBytes(blob.size) + ') сохранён в папку загрузок браузера. В нём ' + nRec(total) + '.'),
        el('p', { class: 'p muted' }, 'Переложите его в надёжное место: на другой диск или в облако. Пока копия лежит только в «Загрузках», это ещё не резерв.'),
        warns.length ? el('p', { class: 'p warnp' }, 'Не удалось добавить файлы: ' + warns.length + '. Первый: ' + warns[0]) : null],
      actions: [{ label: 'Понятно', primary: true }],
    });
  } catch (e) {
    console.error(e); m.close();
    modal({ title: 'Выгрузка не удалась', body: el('p', { class: 'p' }, String(e && e.message || e)), actions: [{ label: 'Закрыть' }] });
  }
}

/* ============ Загрузка из архива ============ */
async function importZip(file) {
  let entries;
  try { entries = await readZip(file); } catch (e) { toast('Не удалось прочитать архив: ' + e.message, { error: true }); return; }
  const recEntries = entries.filter(e => !e.dir && /(^|\/)данные\.json$/.test(e.name));
  if (!recEntries.length) { toast('В этом архиве нет записей энциклопедии.', { error: true }); return; }
  const mode = await new Promise(res => {
    let v = null;
    modal({
      title: 'Загрузка из архива', wide: true,
      body: [el('p', { class: 'p' }, 'В архиве найдено записей: ' + recEntries.length + '. Сейчас в программе: ' + S.records.size + '.'),
        el('p', { class: 'p muted' }, '«Объединить» добавит записи из архива и обновит те, что в архиве новее. «Заменить всё» удалит текущие данные и оставит только содержимое архива.')],
      actions: [{ label: 'Отмена' }, { label: 'Заменить всё', danger: true, onClick: m => { v = 'replace'; m.close(); } }, { label: 'Объединить', primary: true, onClick: m => { v = 'merge'; m.close(); } }],
      onClose: () => res(v),
    });
  });
  if (!mode) return;
  if (mode === 'replace' && !await confirmDialog('Все текущие записи и файлы в программе будут удалены и заменены содержимым архива. Если вы не делали выгрузку, они пропадут безвозвратно.', 'Заменить', true, 'Заменить все данные?')) return;
  const msg = el('p', { class: 'p' }, 'Читаю архив…'), bar = el('div', { class: 'prog' }, el('i', {}));
  const m = modal({ title: 'Загрузка', body: [msg, bar], hideClose: true });
  try {
    let manifest = null;
    const me = entries.find(e => /(^|\/)manifest\.json$/.test(e.name));
    if (me) { try { manifest = JSON.parse(await (await readZipEntry(file, me)).text()); } catch (e) { } }
    if (mode === 'replace') { await DB.clear('records'); await DB.clear('media'); await DB.clear('blobs'); S.records.clear(); S.media.clear(); S.mediaBy.clear(); S.hashIdx.clear(); }
    let done = 0, added = 0, skipped = 0;
    for (const e of recEntries) {
      const data = JSON.parse(await (await readZipEntry(file, e)).text());
      const rec = data.record; if (!rec || !rec.id || !TYPES[rec.type]) { done++; continue; }
      normalizeRecord(rec);
      const ex = S.records.get(rec.id);
      if (ex && ex.updated >= rec.updated) { skipped++; done++; continue; }
      if (ex) for (const mid of Array.from(S.mediaBy.get(rec.id) || [])) await deleteMediaFully(mid);
      const dirName = e.name.slice(0, e.name.length - 'данные.json'.length);
      for (const mt of data.media || []) {
        const ent = entries.find(x => x.name === dirName + 'медиа/' + mt.file); if (!ent) continue;
        const blob = await readZipEntry(file, ent); const meta = { ...mt }; delete meta.file;
        await DB.put('blobs', blob, meta.id); await DB.put('media', meta); registerMedia(meta);
      }
      await DB.put('records', rec); S.records.set(rec.id, rec); added++; done++;
      if (done % 10 === 0) { msg.textContent = 'Записей обработано: ' + done + ' из ' + recEntries.length; $('i', bar).style.width = Math.round(done / recEntries.length * 100) + '%'; await new Promise(r => setTimeout(r, 0)); }
    }
    if (mode === 'replace' && manifest && manifest.settings) {
      S.app.remindDays = manifest.settings.remindDays || 7; S.app.colors = manifest.settings.colors || {}; S.app.recent = [];
      S.app.lastExport = manifest.exported || S.app.lastExport;
    }
    await saveApp();
    m.close();
    modal({
      title: 'Архив загружен', body: el('p', { class: 'p' }, 'Добавлено или обновлено записей: ' + added + (skipped ? '. Пропущено, потому что в программе версии новее: ' + skipped : '') + '.'),
      actions: [{ label: 'Продолжить', primary: true, onClick: () => { location.hash = '#/'; location.reload(); } }], onClose: () => { location.hash = '#/'; location.reload(); }, hideClose: true,
    });
  } catch (e) {
    console.error(e); m.close();
    modal({ title: 'Загрузка не удалась', body: el('p', { class: 'p' }, String(e && e.message || e)), actions: [{ label: 'Закрыть', onClick: x => { x.close(); location.reload(); } }] });
  }
}

'use strict';
/* ============ Напоминание о выгрузке ============ */
function updateBanner() {
  const b = $('#banner'); if (!b) return;
  const n = S.records.size;
  if (!n) { b.hidden = true; return; }
  const last = S.app.lastExport;
  let base = last;
  if (!base) { let min = null; for (const r of S.records.values()) if (!min || r.created < min) min = r.created; base = min || S.app.firstUse; }
  const days = daysSince(base), snoozed = S.app.snoozeUntil && new Date(S.app.snoozeUntil) > new Date();
  if (days < S.app.remindDays || snoozed) { b.hidden = true; return; }
  b.hidden = false; b.innerHTML = '';
  const txt = last ? 'Последняя выгрузка была ' + days + ' ' + plural(days, ['день', 'дня', 'дней']) + ' назад.' : 'Выгрузка ещё ни разу не делалась.';
  b.append(el('span', {}, el('b', {}, txt), ' Пока вы её не сделаете, данные лежат только в этом браузере.'),
    el('button', { class: 'btn small primary', onclick: () => exportAll() }, 'Выгрузить сейчас'),
    el('button', { class: 'btn small', onclick: () => { S.app.snoozeUntil = new Date(Date.now() + 86400000).toISOString(); saveApp(); updateBanner(); } }, 'Напомнить завтра'));
}

/* ============ Маршрутизация ============ */
function route() {
  leaveRecord(); Pop.close();
  const h = location.hash || '#/';
  const m = h.match(/^#\/([^\/]*)\/?(.*)$/) || [, '', ''];
  const a = m[1], b = decodeURIComponent(m[2] || '');
  let active = 'home';
  try {
    if (a === 'cat') { renderCategory(b); active = 'cat/' + b; }
    else if (a === 'rec') { renderRecord(b); const r = S.records.get(b); active = r ? 'cat/' + r.cat : null; }
    else if (a === 'timeline') { renderTimeline(); active = 'timeline'; }
    else if (a === 'search') { renderSearch(); active = 'search'; }
    else renderHome();
  } catch (e) {
    console.error(e);
    $('#main').innerHTML = ''; $('#main').append(el('div', { class: 'empty-page' }, el('h2', {}, 'Что-то пошло не так'), el('p', {}, String(e && e.message || e)), el('a', { class: 'btn', href: '#/' }, 'На главную')));
  }
  renderTree(active);
  updateBanner();
}

/* ============ Запуск ============ */
function fatal(msg) {
  document.body.innerHTML = '';
  document.body.append(el('div', { class: 'fatal' }, el('h1', {}, 'Не удалось запустить хранилище'), el('p', {}, msg),
    el('p', { class: 'muted' }, 'Проверьте, что страница открыта не в приватном окне и что браузер разрешает сайтам хранить данные.')));
}
async function boot() {
  try {
    if (!window.indexedDB) throw new Error('В этом браузере недоступно хранилище IndexedDB.');
    await DB.open(); await loadAll();
  } catch (e) { console.error(e); fatal(String(e && e.message || e)); return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }

  const q = $('#q');
  if (S.app.ui.nav === false) document.body.classList.add('nav-off');
  $('#btn-nav').addEventListener('click', () => { const off = document.body.classList.toggle('nav-off'); S.app.ui.nav = !off; saveApp(); });
  q.addEventListener('input', debounce(() => {
    S.q = q.value;
    if (location.hash === '#/search') renderSearch(); else if (q.value.trim()) location.hash = '#/search';
  }, 140));
  q.addEventListener('keydown', e => { if (e.key === 'Escape') { q.value = ''; S.q = ''; q.blur(); if (location.hash === '#/search') renderSearch(); } });
  $('#btn-new').addEventListener('click', () => { const m = location.hash.match(/^#\/cat\/(.+)$/); createRecordDialog({ cat: m ? m[1] : null }); });
  $('#btn-export').addEventListener('click', () => exportAll());
  $('#btn-more').addEventListener('click', e => { e.stopPropagation(); openMore(e.currentTarget); });
  $('#zipin').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importZip(f); });
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !Pop.box && modals.length) { modals[modals.length - 1].close(); return; }
    if (e.key === 'Escape' && document.body.classList.contains('focus') && !modals.length && !Pop.box && !(curBoard && (curBoard.editing || curBoard.connFrom))) { exitFocus(); return; }
    const t = e.target, typing = t.matches && t.matches('input,textarea,select,[contenteditable="true"]');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); }
    else if (e.key === '/' && !typing && !modals.length) { e.preventDefault(); q.focus(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSaves(); });
  window.addEventListener('pagehide', () => { if (curBoard) curBoard.endEdit(); flushSaves(); });
  window.addEventListener('beforeunload', () => { if (curBoard) curBoard.endEdit(); flushSaves(); });
  guardSecondTab();
  route();
}
/* Две вкладки с программой одновременно могут затереть изменения друг друга */
function guardSecondTab() {
  try {
    const bc = new BroadcastChannel('simbirsk-encyclopedia'); let warned = false;
    bc.onmessage = e => {
      if (e.data === 'ping') bc.postMessage('pong');
      else if (e.data === 'pong' && !warned) {
        warned = true;
        modal({ title: 'Программа уже открыта', body: el('p', { class: 'p' }, 'Эта энциклопедия открыта в другой вкладке. Если работать в двух вкладках одновременно, изменения одной могут затереть изменения другой. Закройте лишнюю вкладку.'), actions: [{ label: 'Всё равно продолжить', primary: true }] });
      }
    };
    bc.postMessage('ping');
  } catch (e) { }
}
document.addEventListener('DOMContentLoaded', boot);

</script>
